# This is a basic Hyprland configuration
# Save as ~/.config/hypr/hyprland.conf

# Monitor configuration
monitor=,preferred,auto,1

# ===== GENERAL SETTINGS =====
general {
    gaps_in = 3
    gaps_out = 8
    col.active_border = rgba(7aa2f7ee) rgba(bb9af7ee) 45deg
    col.inactive_border = rgba(41486866)
}

# ===== DECORATION =====
decoration {
    # Rounded corners
    rounding = 10

    # CORRECT blur syntax:
    blur {
        enabled = yes
        size = 3
        passes = 1
    }
}

# ===== ANIMATIONS =====
animations {
    enabled = yes

    # Simple but effective curves
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    bezier = linear, 0.0, 0.0, 1.0, 1.0

    animation = windows, 1, 5, myBezier, slide
    animation = windowsOut, 1, 5, default, popin 80%
    animation = border, 1, 5, default
    animation = borderangle, 1, 5, default
    animation = fade, 1, 5, default
    animation = workspaces, 1, 5, default
}

windowrule = animation popin, match:class ^(kitty)$
windowrule = animation slide, match:class ^(firefox)$

# ======== WIndow Rule ========== 
# ===== WINDOW RULES =====
# Named rule syntax
windowrule {
    name = global-opacity
    match:class = .*
    
    opacity = 0.90
}
# Make fullscreen windows 100% opaque
#windowrule = opacity 1.0, match:fullscreen yes
# When Chrome/Firefox windows have YouTube/Netflix in title
windowrule = opacity 1.0 override, match:title .*(YouTube|Netflix|Prime Video|Disney\+|Twitch|VLC).*

# Specific video players are always opaque
windowrule = opacity 1.0 override, match:class ^(mpv|vlc|celluloid|plexmediaplayer)$


windowrule {
    name = browser-opacity
    match:class = ^(firefox|google-chrome-stable)$
    
    opacity = 0.90
}

windowrule {
    name = dolphin-opacity
    match:class = ^(dolphin)$
    
    opacity = 0.92
}

windowrule {
    name = kitty-opacity
    match:class = ^(kitty)$
    
    opacity = 0.90
}

windowrule {
    name = spotify-opacity
    match:class = ^(spotify)$
    
    opacity = 0.92
}

# Floating windows
windowrule {
    name = pavucontrol-float
    match:class = ^(pavucontrol)$
    
    float = on
}

windowrule {
    name = blueman-float
    match:class = ^(blueman-manager)$
    
    float = on
}

windowrule {
    name = swaync-float
    match:class = ^(swaync)$  
    
    float = on
}

# Floating window styling
windowrule {
    name = floating-rounding
    match:float = yes
    
    rounding = 15
}

windowrule {
    name = floating-opacity
    match:float = yes
    
    opacity = 0.95
}


# Specific app enhancements
windowrule {
    name = browser-rounding
    match:class = ^(firefox|google-chrome-stable)$
    rounding = 15
}

# Dolphin
windowrule {
    name = dolphin-float
    match:class = ^(dolphin)$
    
    float = on
}

windowrule {
    name = dolphin-size
    match:class = ^(dolphin)$
    
    size = 1000 600
}

windowrule {
    name = dolphin-center
    match:class = ^(dolphin)$
    
    center = on
}

# Kitty terminal
windowrule {
    name = kitty-specific-opacity
    match:class = ^(kitty)$
    
    opacity = 0.70
}

# Rofi
windowrule {
    name = rofi-opacity
    match:class = ^(rofi)$
    
    opacity = 0.98
}

windowrule {
    name = rofi-rounding
    match:class = ^(rofi)$
    
    rounding = 20
}

# Spotify
windowrule {
    name = spotify-noborder
    match:class = ^(spotify)$
    
    decorate = off
}






# ===== AUTOSTART =====
exec-once = swaync
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = nm-applet --indicator
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = hypridle
exec-once = swww-daemon
# exec-once = ~/.scripts/wallpaper-daemon.sh
exec-once = snixembed
exec-once = waybar

# ===== KEYBINDINGS =====
# Keybindings - using SUPER (Windows key)
$mainMod = SUPER
$menu = rofi -show drun

# Applications ===============================================
bind = $mainMod, RETURN, exec, kitty
bind = $mainMod, Q, killactive,
bind = $mainMod, F, fullscreen
bind = $mainMod, E, exec, nautilus
bind = $mainMod, B, exec, firefox
bind = $mainMod, z, exec, evince
bind = $mainMod, n, exec, google-chrome-stable 
bind = $mainMod, v, exec, code
bind = $mainMod, S, exec, spotify
bind = $mainMod, D, exec, $menu
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, togglesplit, # dwindle
bind = SUPER, L, exec, hyprlock
bind = $mainMod, X, exec, wlogout --protocol layer-shell

# FOR FLOATING WINDOWS =========================================
# Toggle floating window
bind = $mainMod, SPACE, togglefloating
# Move floating window
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d
# Resize floating window
bind = $mainMod CTRL, left, resizeactive, -20 0
bind = $mainMod CTRL, right, resizeactive, 20 0
bind = $mainMod CTRL, up, resizeactive, 0 -20
bind = $mainMod CTRL, down, resizeactive, 0 20
# Center floating window
bind = $mainMod, C, centerwindow
bind = $mainMod SHIFT, F, workspaceopt, allfloat

# Screenshot ==================================================
# Screenshot a window
bind = $mainMod, PRINT, exec, hyprshot -m window
# Screenshot a monitor
bind = , PRINT, exec, hyprshot -m output
# Screenshot a region
bind = SHIFT, PRINT, exec, hyprshot -m region

# Move windows with mouse
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Function keys
bind = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
bind = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
bind = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous
bind = , XF86MonBrightnessUp, exec, brightnessctl set +10%
bind = , XF86MonBrightnessDown, exec, brightnessctl set 10%-

# System
bind = $mainMod SHIFT, Q, exit
bind = $mainMod SHIFT, R, exec, hyprctl reload

# Move focus
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10
