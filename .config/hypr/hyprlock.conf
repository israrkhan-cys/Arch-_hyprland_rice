# ╔══════════════════════════════════════════════════════════╗
# ║           hyprlock.conf.tpl  (template)                  ║
# ║     Edit THIS file — hyprlock.conf is auto-generated     ║
# ║     {{R}} {{G}} {{B}} are replaced with accent color     ║
# ╚══════════════════════════════════════════════════════════╝

# ─────────────────────────────────────────────
#  GENERAL
# ─────────────────────────────────────────────
general {
    disable_loading_bar    = false
    hide_cursor            = true
    grace                  = 0
    no_fade_in             = false
    no_fade_out            = false
    ignore_empty_input     = false
    text_trim              = true
}

# ─────────────────────────────────────────────
#  BACKGROUND
# ─────────────────────────────────────────────
background {
    monitor      =
    path         = screenshot
    blur_size    = 7
    blur_passes  = 3
    noise        = 0.05
    contrast     = 0.9
    brightness   = 0.70
    vibrancy     = 0.15
    vibrancy_darkness = 0.0
}

# ─────────────────────────────────────────────
#  TIME  (massive digital clock, center-stage)
# ─────────────────────────────────────────────
label {
    monitor     =
    text        = cmd[update:1000] echo "<span font_family='JetBrains Mono NF' letter_spacing='8000'>$(date +"%H:%M:%S")</span>"
    color       = rgba({{R}}, {{G}}, {{B}}, 0.95)
    font_size   = 120
    font_family = JetBrains Mono NF ExtraBold

    position    = 0, 60
    halign      = center
    valign      = center
    shadow_passes = 5
    shadow_size   = 20
    shadow_color  = rgba({{R}}, {{G}}, {{B}}, 0.28)
    shadow_boost  = 1.5
}

# ─────────────────────────────────────────────
#  DATE  (just below clock)
# ─────────────────────────────────────────────
label {
    monitor     =
    text        = cmd[update:60000] echo "$(date +"%A, %d %B %Y")"
    color       = rgba(210, 210, 210, 0.65)
    font_size   = 20
    font_family = JetBrains Mono

    position    = 0, -30
    halign      = center
    valign      = center
    shadow_passes = 2
    shadow_size   = 4
    shadow_color  = rgba(0, 0, 0, 0.5)
}

# ─────────────────────────────────────────────
#  GREETING  (terminal-style prompt)
# ─────────────────────────────────────────────
label {
    monitor     =
    text        = "> authenticate, $USER"
    color       = rgba({{R}}, {{G}}, {{B}}, 0.55)
    font_size   = 13
    font_family = JetBrains Mono

    position    = 0, -260
    halign      = center
    valign      = center
    shadow_passes = 1
    shadow_size   = 3
    shadow_color  = rgba(0, 0, 0, 0.8)
}

# ─────────────────────────────────────────────
#  PASSWORD INPUT BOX
# ─────────────────────────────────────────────
input-field {
    monitor    =
    size       = 280, 48
    outline_thickness = 2

    outer_color        = rgba({{R}}, {{G}}, {{B}}, 0.70)
    inner_color        = rgba(10, 10, 14, 0.85)
    font_color         = rgba({{R}}, {{G}}, {{B}}, 1.0)
    font_family        = JetBrains Mono

    placeholder_text   = <span foreground="##4d4d4d">••••••••</span>

    check_color        = rgba(100, 200, 255, 0.9)
    fail_color         = rgba(255, 60, 80, 0.9)
    fail_text          = <span foreground="##ff3c50"> access denied</span>
    fail_transition    = 300

    capslock_color     = rgba(255, 200, 0, 0.9)

    dots_size          = 0.28
    dots_spacing       = 0.20
    dots_center        = true
    dots_rounding      = -1

    rounding           = 6
    fade_on_empty      = true
    fade_timeout       = 1000
    hide_input         = false

    position           = 0, -310
    halign             = center
    valign             = center
    shadow_passes      = 3
    shadow_size        = 6
    shadow_color       = rgba(0, 0, 0, 0.7)
}

# ─────────────────────────────────────────────
#  STATUS LABEL
# ─────────────────────────────────────────────
label {
    monitor     =
    text        = "[ system locked ]"
    color       = rgba(120, 120, 130, 0.5)
    font_size   = 11
    font_family = JetBrains Mono

    position    = 0, -370
    halign      = center
    valign      = center
}

# ─────────────────────────────────────────────
#  BOTTOM-LEFT: hostname
# ─────────────────────────────────────────────
label {
    monitor     =
    text        = cmd[update:0] echo "$(hostname)"
    color       = rgba({{R}}, {{G}}, {{B}}, 0.35)
    font_size   = 11
    font_family = JetBrains Mono

    position    = 24, -24
    halign      = left
    valign      = bottom
}

# ─────────────────────────────────────────────
#  BOTTOM-RIGHT: uptime
# ─────────────────────────────────────────────
label {
    monitor     =
    text        = cmd[update:60000] echo "up $(uptime -p | sed 's/up //')"
    color       = rgba({{R}}, {{G}}, {{B}}, 0.35)
    font_size   = 11
    font_family = JetBrains Mono

    position    = -24, -24
    halign      = right
    valign      = bottom
}
